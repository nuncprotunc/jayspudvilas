<svg width="300" height="300" viewBox="0 0 300 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="js-ring2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6b21a8"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="js-div" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6b21a8"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
  </defs>
  <!-- Outer ring -->
  <circle cx="150" cy="150" r="146" fill="#0a0e17" stroke="url(#js-ring2)" stroke-width="4"/>
  <!--
    Canonical 80x80 geometry scaled ~1.8x, centred horizontally.
    Arc: M20,55 Q40,35 60,55 → scale 1.8 → M36,99 Q72,63 108,99
    Shift right by 42 to centre arc midpoint at x=150: M78,99 Q114,63 150,99
    Purple: cx=40,cy=43,r=8 → cx=114,cy=77,r=14
    Blue: cx=60,cy=55,r=6 → cx=150,cy=99,r=11
  -->
  <!--
    Canonical 80x80 bbox centre (43,48). Scale 1.8x → (77.4, 86.4). Target (150,100). tx=72.6, ty=13.6
  -->
  <g transform="translate(72.6, 14.6) scale(1.8)">
    <path d="M 20 55 Q 40 35, 60 55" stroke="#1e40af" stroke-width="3.5" fill="none" opacity="0.7"/>
    <circle cx="40" cy="43" r="8" fill="#6b21a8"/>
    <circle cx="60" cy="55" r="6" fill="#3E5BE8"/>
  </g>
  <!-- Divider -->
  <rect x="100" y="148" width="100" height="3" fill="url(#js-div)"/>
  <!-- Text: JAY -->
  <text x="150" y="192" font-family="Georgia, serif" font-size="32" font-weight="bold" fill="#f8fafc" text-anchor="middle" letter-spacing="5">JAY</text>
  <!-- Text: SPUDVILAS -->
  <text x="150" y="228" font-family="Georgia, serif" font-size="19" font-weight="bold" fill="#94a3b8" text-anchor="middle" letter-spacing="2">SPUDVILAS</text>
</svg>
